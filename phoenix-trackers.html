<style>
  :root{--bg:#0a1420;--bg-deep:#060d16;--panel:#101f34;--panel-2:#16283f;--line:#223a54;
    --ice:#7fd9ee;--ice-dim:#4f95a8;--text:#eaf3f9;--text-dim:#86a0b7;
    --good:#22c55e;--mid:#eab308;--bad:#ef4444;--fire:#ff7a2e;}
  *{box-sizing:border-box;} html,body{margin:0;padding:0;}
  body{background:radial-gradient(ellipse at top,#10233a 0%,var(--bg) 55%,var(--bg-deep) 100%);
    color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;padding:16px 12px 60px;}
  h1{font-family:'Rajdhani',sans-serif;font-size:1.35rem;margin:0 0 4px;}
  .wrap{max-width:600px;margin:0 auto;}
  header{text-align:center;margin-bottom:12px;}
  .eyebrow{font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ice-dim);}
  p.sub{font-size:.8rem;color:var(--text-dim);margin:2px 0 0;}
  .back{display:inline-block;color:var(--ice-dim);text-decoration:none;font-size:.8rem;margin-bottom:8px;}
  .panel{background:linear-gradient(180deg,var(--panel),var(--panel-2));border:1px solid var(--line);
    border-radius:14px;padding:14px;margin-bottom:14px;}
  .panel-title{font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;color:var(--ice-dim);margin-bottom:10px;font-weight:600;}
  .tabs{display:flex;gap:6px;margin-bottom:14px;}
  .tab{flex:1;padding:10px 4px;border-radius:11px;border:1px solid var(--line);background:var(--bg-deep);
    color:var(--text-dim);font-size:.8rem;font-weight:700;cursor:pointer;text-align:center;}
  .tab.on{border-color:var(--fire);color:var(--fire);background:rgba(255,122,60,.1);}
  .row{display:flex;gap:8px;flex-wrap:wrap;}
  .btn{background:transparent;border:1px solid var(--line);color:var(--text-dim);padding:9px 14px;
    border-radius:9px;font-size:.82rem;font-weight:600;cursor:pointer;}
  .btn.fire{background:linear-gradient(90deg,var(--fire),#ffb938);border:none;color:#08131f;font-weight:800;}
  input,select{background:var(--bg-deep);border:1px solid var(--line);color:var(--text);
    padding:9px 11px;border-radius:9px;font-size:.85rem;width:100%;}
  .field{margin-bottom:10px;}
  .field label{display:block;font-size:.74rem;color:var(--text-dim);margin-bottom:5px;}

  .sumRow{display:flex;align-items:center;gap:8px;padding:9px 4px;border-top:1px solid var(--line);}
  .sumRow:first-child{border-top:none;}
  .sumName{flex:1;font-size:.85rem;font-weight:600;color:var(--text);}
  .sumPct{width:52px;text-align:right;font-weight:800;font-size:.85rem;}
  .barTrack{flex:1.4;height:8px;background:var(--bg-deep);border-radius:99px;overflow:hidden;}
  .barFill{height:100%;border-radius:99px;}
  .good{color:var(--good);} .mid{color:var(--mid);} .bad{color:var(--bad);}
  .bgGood{background:var(--good);} .bgMid{background:var(--mid);} .bgBad{background:var(--bad);}
  .sumDmg{width:78px;text-align:right;font-size:.72rem;color:var(--text-dim);}
  .sumEdit{display:flex;gap:4px;flex:none;margin-left:2px;}
  .sumEdit button{background:transparent;border:1px solid var(--line);color:var(--text-dim);
    border-radius:7px;width:26px;height:26px;font-size:.75rem;cursor:pointer;padding:0;line-height:1;}

  .sessList{margin-top:6px;}
  .sessItem{display:flex;align-items:center;gap:8px;padding:9px 4px;border-top:1px solid var(--line);font-size:.82rem;}
  .sessItem:first-child{border-top:none;}
  .sessItem b{color:var(--text);}
  .sessItem .sp{flex:1;color:var(--text-dim);}
  .sessItem button{background:transparent;border:1px solid var(--line);color:var(--text-dim);border-radius:7px;
    padding:5px 9px;font-size:.72rem;cursor:pointer;}

  .rosterRow{display:flex;align-items:center;gap:8px;padding:8px 2px;border-top:1px solid var(--line);}
  .rosterRow:first-child{border-top:none;}
  .rosterName{flex:1;font-size:.83rem;color:var(--text);}
  .rosterRow input[type=checkbox]{width:19px;height:19px;flex:none;accent-color:var(--fire);}
  .rosterRow input[type=number]{width:74px;flex:none;padding:6px 8px;font-size:.8rem;}
  .rosterChk{display:flex;align-items:center;gap:4px;font-size:.68rem;color:var(--text-dim);flex:none;}

  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:#0d1b2a;
    color:#fff;padding:10px 20px;border-radius:14px;font-weight:600;font-size:.85rem;opacity:0;transition:.25s;z-index:99;border:1px solid var(--line);}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .instructions{font-size:.78rem;color:var(--text-dim);line-height:1.5;}

  /* GATE */
  #phxGate{position:fixed;inset:0;background:var(--bg-deep);z-index:999;display:flex;align-items:center;justify-content:center;padding:24px;}
  #phxGateMsg{max-width:320px;text-align:center;color:var(--text-dim);font-size:.9rem;line-height:1.6;}
</style>

<script>

──────────────────────────────────────────────────────────────────── */
var SUPA_URL='https://vghutrfcrqgelvgdeesl.supabase.co';
var SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZnaHV0cmZjcnFnZWx2Z2RlZXNsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIyMDQ4ODksImV4cCI6MjA5Nzc4MDg4OX0.uarvB0sTDPqS1AysfvDRJahRYRLiJaBO2kVIiyGaDAE';
var sb=null, ACTIVE_ALLIANCE_ID=null, canEdit=false, isGlobalAdmin=false, allianceChoices=[];
function gmsg(h){var m=document.getElementById('phxGateMsg');if(m)m.innerHTML=h;}
function unlock(allianceId, editRights){
  ACTIVE_ALLIANCE_ID=allianceId;
  canEdit=editRights;
  var g=document.getElementById('phxGate');if(g&&g.parentNode)g.parentNode.removeChild(g);
  boot();
}
function getState(){
  var q=new URLSearchParams(location.search).get('s');
  if(q) return q;
  try{var ls=localStorage.getItem('phx_state'); if(ls) return ls;}catch(e){}
  return '3139';
}
(function(){
  try{
    if(!(window.supabase&&window.supabase.createClient)){gmsg('Could not load. Reload the page.');return;}
    sb=window.supabase.createClient(SUPA_URL,SUPA_KEY);
    sb.auth.getSession().then(function(r){
      var s=r&&r.data&&r.data.session;
      if(!s){gmsg('🔒 Sign in to Phoenix first to see attendance rankings.');return;}
      sb.from('players').select('role,alliance_id').eq('owner',s.user.id).eq('state_id',getState()).then(function(res){
        var rows=res.data||[];
        isGlobalAdmin=rows.some(function(p){return p.role==='admin';});
        var leaderRow=rows.find(function(p){return (p.role==='r4'||p.role==='r5')&&p.alliance_id;});
        var anyRow=rows.find(function(p){return p.alliance_id;});

        if(isGlobalAdmin){
          sb.from('alliances').select('id,tag,name').eq('state_id',getState()).order('tag').then(function(ar){

            if(!allianceChoices.length){gmsg('No alliances found in this state.');return;}
            renderAdminPicker();
            unlock(allianceChoices[0].id, true);
          });
          return;
        }
        if(leaderRow){ unlock(leaderRow.alliance_id, true); return; }
        if(anyRow){ unlock(anyRow.alliance_id, false); return; }
        gmsg('🔒 You need to be a registered player in an alliance to view this.');
      }).catch(function(){gmsg('Error checking permissions.');});
    }).catch(function(){gmsg('Session error.');});
  }catch(e){gmsg('Access error.');}
})();
function renderAdminPicker(){
  var bar=document.createElement('div');
  bar.className='row';
  bar.style.marginBottom='10px';
  bar.innerHTML='<select id="adminAllianceSelect" style="flex:1;">'+
    allianceChoices.map(function(a){return '<option value="'+a.id+'">['+ (a.tag||'') +'] '+(a.name||'')+'</option>';}).join('')+
  '</select>';

  wrap.insertBefore(bar, wrap.children[1]);
  document.getElementById('adminAllianceSelect').addEventListener('change', async function(){
    ACTIVE_ALLIANCE_ID=this.value; canEdit=true;
    await loadRoster(); showSummaryScreen();
  });
}
(function(){
  var q=new URLSearchParams(location.search).get('s');
  var s=q; if(!s){try{s=localStorage.getItem('phx_state');}catch(e){}}
  var bl=document.getElementById('backLink');
  if(bl && s && s!=='3139') bl.href='phoenix-tools.html?s='+s;
})();

/* ── STATE ─────────────────────────────────────────────────────── */
var currentTab='bt'; // bt | foundry | canyon
var entryTrap='T1';   // which trap the open session-entry form is for (bt only)
var entryLegion='L1'; // which legion the open session-entry form is for (foundry only)
var roster=[];        // [{id,name}]
var editingSessionId=null;
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},1700);}
function sessTable(){return currentTab==='bt'?'bt_sessions':'event_sessions';}
function entryTable(){return currentTab==='bt'?'bt_entries':'event_entries';}
function tabLabel(){return currentTab==='bt'?'Bear Trap':(currentTab==='foundry'?'Foundry':'Canyon');}

async function boot(){
  document.querySelectorAll('.mainTab').forEach(function(t){
    t.addEventListener('click',async function(){
      document.querySelectorAll('.mainTab').forEach(function(x){x.classList.remove('on');});
      t.classList.add('on'); currentTab=t.dataset.t;
      document.getElementById('addPlayerRow').style.display=(currentTab==='bt')?'flex':'none';
      document.getElementById('exportBtnBT').textContent='⬇ Excel';
      await loadRoster();
      showSummaryScreen();
    });
  });
  document.querySelectorAll('#entryTrapTabs .trapTab').forEach(function(t){
    t.addEventListener('click',function(){
      document.querySelectorAll('#entryTrapTabs .trapTab').forEach(function(x){x.classList.remove('on');});
      t.classList.add('on'); entryTrap=t.dataset.trap;
    });
  });
  document.querySelectorAll('#entryLegionTabs .legionTab').forEach(function(t){
    t.addEventListener('click',function(){
      document.querySelectorAll('#entryLegionTabs .legionTab').forEach(function(x){x.classList.remove('on');});
      t.classList.add('on'); entryLegion=t.dataset.legion;
    });
  });
  document.getElementById('newSessionBtn').addEventListener('click',function(){openEntry(null);});
  document.getElementById('exportBtnBT').addEventListener('click',function(){
    if(currentTab==='bt') exportBTExcel(); else exportEventExcel();
  });
  document.getElementById('entryBack').addEventListener('click',function(e){e.preventDefault();showSummaryScreen();});
  document.getElementById('saveSessionBtn').addEventListener('click',saveSession);
  document.getElementById('deleteSessionBtn').addEventListener('click',deleteSession);
  document.getElementById('rosterSearch').addEventListener('input',function(){renderRoster(this.value);});
  document.getElementById('addPlayerBtn').addEventListener('click',addAdhocPlayer);
  document.getElementById('newPlayerName').addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();addAdhocPlayer();}});
  document.getElementById('addPlayerRow').style.display='flex';
  if(!canEdit){
    document.getElementById('newSessionBtn').style.display='none';
    document.getElementById('addPlayerRow').style.display='none';
    var note=document.createElement('p');
    note.className='instructions';
    note.style.textAlign='center';
    note.textContent='👀 View only — ask an R4/R5 to log attendance.';
    document.querySelector('header').insertAdjacentElement('afterend', note);
  }

  await loadRoster();
  showSummaryScreen();
}

/* Bear Trap roster = confirmed PXR members ∪ any ad-hoc names ever used in bt_entries
   (covers people who play but never made a Phoenix profile — very common). */
async function loadRoster(){
  if(currentTab!=='bt'){
    var {data}=await sb.from('players').select('id,name').eq('alliance_id',ACTIVE_ALLIANCE_ID).order('name');
    roster=(data||[]).filter(function(p){return p.name;});
    return;
  }
  var confirmed=(await sb.from('players').select('id,name').eq('alliance_id',ACTIVE_ALLIANCE_ID)).data||[];
  var adhoc=(await sb.from('bt_roster_names').select('id,name').eq('alliance_id',ACTIVE_ALLIANCE_ID)).data||[];
  var seen={}, merged=[];
  confirmed.concat(adhoc).forEach(function(p){
    if(!p.name) return;
    var key=p.name.toLowerCase();
    if(seen[key]) return;
    seen[key]=true;
    merged.push({id:p.id, name:p.name});
  });
  merged.sort(function(a,b){return a.name.localeCompare(b.name);});
  roster=merged;
}

async function addAdhocPlayer(){
  var input=document.getElementById('newPlayerName');
  var name=input.value.trim();
  if(!name){ toast('Type a name first'); return; }
  if(roster.length>=100){ toast('Roster is full (100 max)'); return; }
  if(roster.some(function(p){return p.name.toLowerCase()===name.toLowerCase();})){
    toast('Already on the list'); return;
  }
  var {data,error}=await sb.from('bt_roster_names').insert({alliance_id:ACTIVE_ALLIANCE_ID,name:name}).select('id,name').single();
  if(error){ toast('Error: '+error.message); return; }
  roster.push({id:data.id,name:data.name,adhoc:true});
  roster.sort(function(a,b){return a.name.localeCompare(b.name);});
  input.value='';
  // mark them present immediately in the currently-open entry form
  currentEntries[data.name.toLowerCase()]={attended:true,requested:false,damage:0,name:data.name};
  renderRoster(document.getElementById('rosterSearch').value);
  toast('Added ✓');
}

/* ── SUMMARY SCREEN ───────────────────────────────────────────── */
async function showSummaryScreen(){
  document.getElementById('entryScreen').style.display='none';
  document.querySelector('.wrap').style.display='';
  document.getElementById('summaryTitle').textContent=tabLabel()+' — attendance summary';
  document.getElementById('rosterTitle');
  await Promise.all([renderSummary(), renderSessionsList()]);

async function renderSummary(){
  if(currentTab==='bt') return renderBTSummary();
  return renderEventSummary();
}

/* Foundry/Canyon summary: "requested battle" and "showed up" are tracked separately.
   One combined ranking, same as Bear Trap does with T1/T2 — Foundry rows also show
   the Legión 1 / Legión 2 split, since a player isn't locked to one legion forever.
   Players who never request aren't penalized. R4/R5/admin can remove a player's
   history here directly once they've left PXR. */
async function renderEventSummary(){
  var box=document.getElementById('summaryBox');
  box.innerHTML='Loading…';
  document.getElementById('summaryTitle').textContent=tabLabel()+' — battle requests & attendance';

  var r=await sb.from('event_sessions').select('id,label').eq('alliance_id',ACTIVE_ALLIANCE_ID).eq('event_type',currentTab);
  var sessRows=r.data||[];
  if(!sessRows.length){ box.innerHTML='No sessions logged yet. Tap "＋ New session" to start.'; return; }
  var sessIds=sessRows.map(function(s){return s.id;});
  var labelBySession={}; sessRows.forEach(function(s){ labelBySession[s.id]=s.label||''; });

  var er=await sb.from('event_entries').select('session_id,player_id,player_name,requested,attended').in('session_id',sessIds);
  var entries=er.data||[];

  var isFoundry=(currentTab==='foundry');
  var byPlayer={};
  entries.forEach(function(e){
    var key=e.player_id||('name:'+e.player_name);
    if(!byPlayer[key]) byPlayer[key]={key:key,name:e.player_name,requested:0,showedUp:0,noShow:0,bonus:0,l1req:0,l1show:0,l2req:0,l2show:0};
    var p=byPlayer[key];
    var lbl=labelBySession[e.session_id];
    if(e.requested){
      p.requested++;
      if(e.attended) p.showedUp++; else p.noShow++;
      if(lbl==='Legión 1'){ p.l1req++; if(e.attended) p.l1show++; }
      else if(lbl==='Legión 2'){ p.l2req++; if(e.attended) p.l2show++; }
    }else if(e.attended){
      p.bonus++; // showed up without requesting — doesn't hurt or help the rate
    }
  });
  // every roster member appears, even if they've never requested a battle
  roster.forEach(function(p){
    if(!byPlayer[p.id]) byPlayer[p.id]={key:p.id,name:p.name,requested:0,showedUp:0,noShow:0,bonus:0,l1req:0,l1show:0,l2req:0,l2show:0};
  });

  var list=Object.keys(byPlayer).map(function(k){return byPlayer[k];});
  list.forEach(function(p){ p.rate = p.requested>0 ? Math.round(p.showedUp/p.requested*100) : null; });
  list.sort(function(a,b){
    if(a.requested===0 && b.requested===0) return a.name.localeCompare(b.name);
    if(a.requested===0) return 1;
    if(b.requested===0) return -1;
    return a.rate-b.rate || b.requested-a.requested;
  });

  box.innerHTML='<div class="instructions" style="margin-bottom:8px;">'+sessRows.length+' session'+(sessRows.length===1?'':'s')+' logged · sorted by no-show rate (worst first) · players who never request aren\'t penalized.</div>';
  var wrap=document.createElement('div');
  list.forEach(function(p){
    var row=document.createElement('div');
    row.className='sumRow';
    var detailDiv=null;
    var editHtml=canEdit?'<div class="sumEdit"><button class="evDelName" title="Remove">🗑</button></div>':'';
    if(p.requested===0){
      row.innerHTML=
        '<div class="sumName" style="color:var(--text-dim);">'+escapeHtml(p.name)+'</div>'+
        '<div class="sumDmg" style="width:auto;flex:1.6;text-align:left;">Never requested battle</div>'+
        '<div class="sumPct" style="color:var(--text-dim);">—</div>'+editHtml;
    }else{
      var cls = p.rate>=80?'good':(p.rate>=50?'mid':'bad');
      var bg = p.rate>=80?'bgGood':(p.rate>=50?'bgMid':'bgBad');
      row.innerHTML=
        '<div class="sumName">'+escapeHtml(p.name)+'</div>'+
        '<div class="barTrack"><div class="barFill '+bg+'" style="width:'+p.rate+'%"></div></div>'+
        '<div class="sumPct '+cls+'">'+p.rate+'%</div>'+editHtml;
      detailDiv=document.createElement('div');
      detailDiv.className='instructions';
      detailDiv.style.cssText='margin:-4px 0 8px 2px;';
      var detail='Requested '+p.requested+' · Showed up '+p.showedUp+' · No-show '+p.noShow;
      if(isFoundry) detail+=' · L1 '+p.l1show+'/'+p.l1req+' · L2 '+p.l2show+'/'+p.l2req;
      if(p.bonus) detail+=' · +'+p.bonus+' extra (attended without requesting)';
      detailDiv.textContent=detail;
    }
    var delBtn=row.querySelector('.evDelName');
    if(delBtn) delBtn.addEventListener('click',function(){ deleteEventPlayer(p.key,p.name); });
    wrap.appendChild(row);
    if(detailDiv) wrap.appendChild(detailDiv);
  });
  box.appendChild(wrap);
}

/* Removes a player's entire attendance history for the active tab (Foundry or Canyon) —
   for when they've left PXR. Doesn't touch the other tab's history. */
async function deleteEventPlayer(key, name){
  if(!confirm('Remove "'+name+'" from '+tabLabel()+'? This deletes all their request/attendance history for this tab.')) return;
  var r=await sb.from('event_sessions').select('id').eq('alliance_id',ACTIVE_ALLIANCE_ID).eq('event_type',currentTab);
  var sessIds=(r.data||[]).map(function(s){return s.id;});
  if(sessIds.length){
    var er=await sb.from('event_entries').select('id,player_id,player_name').in('session_id',sessIds);
    var toDelete=(er.data||[]).filter(function(e){
      var k=e.player_id||('name:'+e.player_name);
      return k===key;
    }).map(function(e){return e.id;});
    if(toDelete.length) await sb.from('event_entries').delete().in('id',toDelete);
  }
  roster=roster.filter(function(p){return p.id!==key;});
  toast('Removed ✓');
  renderEventSummary();
}

/* Bear Trap summary: Total / T1 / T2 / Prefers — mirrors the spreadsheet ranking, sorted by Total desc.
   Every roster member appears, even with 0 attendance. R4/R5/admin can rename or remove a name inline. */
async function renderBTSummary(){
  var box=document.getElementById('summaryBox');
  box.innerHTML='Loading…';
  document.getElementById('summaryTitle').textContent='Bear Trap — ranking (all traps combined)';

  var {data:sessRows}=await sb.from('bt_sessions').select('id,trap').eq('alliance_id',ACTIVE_ALLIANCE_ID);
  sessRows=sessRows||[];
  var trapBySession={};
  sessRows.forEach(function(s){ trapBySession[s.id]=s.trap||'T1'; });
  var sessIds=sessRows.map(function(s){return s.id;});

  var entries=[];
  if(sessIds.length){
    var er=await sb.from('bt_entries').select('session_id,player_name,attended').in('session_id',sessIds);
    entries=er.data||[];
  }

  var byPlayer={};
  entries.forEach(function(e){
    if(!e.attended) return;
    var key=(e.player_name||'').toLowerCase();
    if(!key) return;
    if(!byPlayer[key]) byPlayer[key]={name:e.player_name,total:0,t1:0,t2:0};
    byPlayer[key].total++;
    var trap=trapBySession[e.session_id];
    if(trap==='T1') byPlayer[key].t1++; else if(trap==='T2') byPlayer[key].t2++;
  });
  // every current roster member shows up, even with 0 attendance
  roster.forEach(function(p){
    var key=p.name.toLowerCase();
    if(!byPlayer[key]) byPlayer[key]={name:p.name,total:0,t1:0,t2:0};
  });

  var list=Object.keys(byPlayer).map(function(k){return byPlayer[k];});
  if(!list.length){ box.innerHTML='No sessions logged yet. Tap "＋ New session" to start.'; return; }
  list.sort(function(a,b){ return b.total-a.total || a.name.localeCompare(b.name); });

  box.innerHTML='<div class="instructions" style="margin-bottom:8px;">'+sessRows.length+' Bear Trap'+(sessRows.length===1?'':'s')+' logged · '+list.length+' player'+(list.length===1?'':'s')+' · sorted by total attendance.</div>';
  var wrap=document.createElement('div');
  list.forEach(function(p){
    var pref = p.total===0 ? '—' : (p.t1===p.t2 ? 'Even' : (p.t1>p.t2 ? 'Trap 1' : 'Trap 2'));
    var row=document.createElement('div');
    row.className='sumRow';
    var editHtml=canEdit?'<div class="sumEdit"><button class="btEditName" title="Rename">✎</button><button class="btDelName" title="Remove">🗑</button></div>':'';
    row.innerHTML=
      '<div class="sumName">'+escapeHtml(p.name)+'</div>'+
      '<div class="sumDmg" style="width:auto;flex:1.2;text-align:left;">T1 '+p.t1+' · T2 '+p.t2+' · prefers '+pref+'</div>'+
      '<div class="sumPct '+(p.total>0?'good':'bad')+'">'+p.total+'</div>'+editHtml;
    if(canEdit){
      row.querySelector('.btEditName').addEventListener('click',function(){ renameBTPlayer(p.name); });
      row.querySelector('.btDelName').addEventListener('click',function(){ deleteBTPlayer(p.name); });
    }
    wrap.appendChild(row);
  });
  box.appendChild(wrap);
}

async function deleteBTPlayer(name){
  if(!confirm('Remove "'+name+'" from the Bear Trap tracker? This deletes all their attendance history.')) return;
  var sessIds=((await sb.from('bt_sessions').select('id').eq('alliance_id',ACTIVE_ALLIANCE_ID)).data||[]).map(function(s){return s.id;});
  if(sessIds.length){
    var allEntries=(await sb.from('bt_entries').select('id,player_name').in('session_id',sessIds)).data||[];
    var toDelete=allEntries.filter(function(e){return (e.player_name||'').toLowerCase()===name.toLowerCase();}).map(function(e){return e.id;});
    if(toDelete.length) await sb.from('bt_entries').delete().in('id',toDelete);
  }
  var rnRows=(await sb.from('bt_roster_names').select('id,name').eq('alliance_id',ACTIVE_ALLIANCE_ID)).data||[];
  var rnMatch=rnRows.find(function(r){return (r.name||'').toLowerCase()===name.toLowerCase();});
  if(rnMatch) await sb.from('bt_roster_names').delete().eq('id',rnMatch.id);
  roster=roster.filter(function(p){return p.name.toLowerCase()!==name.toLowerCase();});
  toast('Removed ✓');
  renderBTSummary();
}

async function renameBTPlayer(oldName){
  var newName=prompt('New name for "'+oldName+'":', oldName);
  if(!newName) return;
  newName=newName.trim();
  if(!newName||newName.toLowerCase()===oldName.toLowerCase()) return;
  var sessIds=((await sb.from('bt_sessions').select('id').eq('alliance_id',ACTIVE_ALLIANCE_ID)).data||[]).map(function(s){return s.id;});
  if(sessIds.length){
    var allEntries=(await sb.from('bt_entries').select('id,player_name').in('session_id',sessIds)).data||[];
    var toUpdate=allEntries.filter(function(e){return (e.player_name||'').toLowerCase()===oldName.toLowerCase();}).map(function(e){return e.id;});
    if(toUpdate.length) await sb.from('bt_entries').update({player_name:newName}).in('id',toUpdate);
  }
  var rnRows=(await sb.from('bt_roster_names').select('id,name').eq('alliance_id',ACTIVE_ALLIANCE_ID)).data||[];
  var rnMatch=rnRows.find(function(r){return (r.name||'').toLowerCase()===oldName.toLowerCase();});
  if(rnMatch) await sb.from('bt_roster_names').update({name:newName}).eq('id',rnMatch.id);
  var idx=roster.findIndex(function(p){return p.name.toLowerCase()===oldName.toLowerCase();});
  if(idx>=0) roster[idx].name=newName;
  toast('Renamed ✓');
  renderBTSummary();
}
/* Exports the full Foundry/Canyon history as an .xlsx: one column per session (date + label).
   "X" = attended, "R" = requested but no-showed, blank = wasn't in that session at all.
   Plus Requested / Attended / No-show / Rate% summary columns. */
async function exportEventExcel(){
  if(!window.XLSX){ toast('Excel library failed to load — check connection'); return; }
  toast('Building Excel…');
  var {data:sessRows}=await sb.from('event_sessions').select('id,session_date,label').eq('alliance_id',ACTIVE_ALLIANCE_ID).eq('event_type',currentTab);
  sessRows=sessRows||[];
  sessRows.sort(function(a,b){ return a.session_date.localeCompare(b.session_date); });
  if(!sessRows.length){ toast('No sessions to export yet'); return; }
  var sessIds=sessRows.map(function(s){return s.id;});

  var {data:entries}=await sb.from('event_entries').select('session_id,player_id,player_name,requested,attended').in('session_id',sessIds);
  entries=entries||[];

  var byPlayer={};
  roster.forEach(function(p){ byPlayer[p.id]={name:p.name,requested:0,attendedCount:0,noShow:0,cells:{}}; });
  entries.forEach(function(e){
    var key=e.player_id||('name:'+e.player_name);
    if(!byPlayer[key]) byPlayer[key]={name:e.player_name,requested:0,attendedCount:0,noShow:0,cells:{}};
    var p=byPlayer[key];
    if(e.requested){
      p.requested++;
      if(e.attended){ p.attendedCount++; p.cells[e.session_id]='X'; }
      else { p.noShow++; p.cells[e.session_id]='R'; }
    }else if(e.attended){
      p.cells[e.session_id]='X';
    }
  });

  var players=Object.keys(byPlayer).map(function(k){return byPlayer[k];});
  players.forEach(function(p){ p.rate = p.requested>0 ? Math.round(p.attendedCount/p.requested*100) : -1; });
  players.sort(function(a,b){
    if(a.requested===0 && b.requested===0) return a.name.localeCompare(b.name);
    if(a.requested===0) return 1;
    if(b.requested===0) return -1;
    return a.rate-b.rate || b.requested-a.requested;
  });

  var header=['Player'];
  sessRows.forEach(function(s){
    var d=s.session_date;
    var dm=d.slice(8,10)+'/'+d.slice(5,7);
    header.push(dm+(s.label?(' '+s.label):''));
  });
  header.push('Requested','Attended','No-show','Rate%');

  var aoa=[header];
  players.forEach(function(p){
    var row=[p.name];
    sessRows.forEach(function(s){ row.push(p.cells[s.id]||''); });
    row.push(p.requested,p.attendedCount,p.noShow, p.requested>0?p.rate:'—');
    aoa.push(row);
  });

  var ws=XLSX.utils.aoa_to_sheet(aoa);
  var colWidths=[{wch:22}];
  sessRows.forEach(function(){colWidths.push({wch:13});});
  colWidths.push({wch:10},{wch:9},{wch:9},{wch:8});
  ws['!cols']=colWidths;

  var wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,tabLabel());
  var today=new Date().toISOString().slice(0,10);
  XLSX.writeFile(wb,currentTab+'_attendance_'+today+'.xlsx');
  toast('Downloaded ✓');
}
function escapeHtml(s){var d=document.createElement('div');d.textContent=s||'';return d.innerHTML;}

/* Exports the full Bear Trap history as an .xlsx: one column per session (date + trap),
   one row per roster member, "X" where they attended, plus Total/T1/T2/Prefers at the end. */
async function exportBTExcel(){
  if(!window.XLSX){ toast('Excel library failed to load — check connection'); return; }
  toast('Building Excel…');
  var {data:sessRows}=await sb.from('bt_sessions').select('id,session_date,trap,label').eq('alliance_id',ACTIVE_ALLIANCE_ID).order('session_date',{ascending:true});
  sessRows=sessRows||[];
  sessRows.sort(function(a,b){ return a.session_date.localeCompare(b.session_date) || (a.trap||'T1').localeCompare(b.trap||'T1'); });
  if(!sessRows.length){ toast('No sessions to export yet'); return; }
  var sessIds=sessRows.map(function(s){return s.id;});

  var {data:entries}=await sb.from('bt_entries').select('session_id,player_name,attended').in('session_id',sessIds);
  entries=entries||[];

  var trapBySession={}; sessRows.forEach(function(s){ trapBySession[s.id]=s.trap||'T1'; });
  var attendKey={};
  entries.forEach(function(e){ if(e.attended) attendKey[(e.player_name||'').toLowerCase()+'|'+e.session_id]=true; });

  var byPlayer={};
  roster.forEach(function(p){ byPlayer[p.name.toLowerCase()]={name:p.name,total:0,t1:0,t2:0}; });
  entries.forEach(function(e){
    if(!e.attended) return;
    var key=(e.player_name||'').toLowerCase();
    if(!byPlayer[key]) byPlayer[key]={name:e.player_name,total:0,t1:0,t2:0}; // historical name, no longer on roster
    byPlayer[key].total++;
    var trap=trapBySession[e.session_id];
    if(trap==='T1') byPlayer[key].t1++; else if(trap==='T2') byPlayer[key].t2++;
  });

  var players=Object.keys(byPlayer).map(function(k){return byPlayer[k];});
  players.sort(function(a,b){ return b.total-a.total || a.name.localeCompare(b.name); });

  var header=['Player'];
  sessRows.forEach(function(s){
    var d=s.session_date;
    var dm=d.slice(8,10)+'/'+d.slice(5,7);
    header.push(dm+' '+(s.trap||'T1')+(s.label?(' ('+s.label+')'):''));
  });
  header.push('Total','T1','T2','Prefers');

  var aoa=[header];
  players.forEach(function(p){
    var row=[p.name];
    sessRows.forEach(function(s){
      row.push(attendKey[p.name.toLowerCase()+'|'+s.id] ? 'X' : '');
    });
    var pref = p.total===0?'—':(p.t1===p.t2?'Even':(p.t1>p.t2?'Trap 1':'Trap 2'));
    row.push(p.total,p.t1,p.t2,pref);
    aoa.push(row);
  });

  var ws=XLSX.utils.aoa_to_sheet(aoa);
  var colWidths=[{wch:22}];
  sessRows.forEach(function(){colWidths.push({wch:13});});
  colWidths.push({wch:8},{wch:6},{wch:6},{wch:10});
  ws['!cols']=colWidths;

  var wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'Bear Trap');
  var today=new Date().toISOString().slice(0,10);
  XLSX.writeFile(wb,'bear_trap_attendance_'+today+'.xlsx');
  toast('Downloaded ✓');
}

  var box=document.getElementById('sessList');
  box.innerHTML='Loading…';
  var rows;
  if(currentTab==='bt'){
    var r=await sb.from('bt_sessions').select('id,session_date,label,trap').eq('alliance_id',ACTIVE_ALLIANCE_ID).order('session_date',{ascending:false});
    rows=r.data||[];
  }else{
    var r=await sb.from('event_sessions').select('id,session_date,label').eq('alliance_id',ACTIVE_ALLIANCE_ID).eq('event_type',currentTab).order('session_date',{ascending:false});

  box.innerHTML='';

/* ── NEW / EDIT SESSION ───────────────────────────────────────── */
var currentEntries={}; // player_id or name -> {attended,requested,damage}
async function openEntry(sessionId){
  editingSessionId=sessionId;
  document.querySelector('.wrap').style.display='none';
  document.getElementById('entryScreen').style.display='';
  document.getElementById('entryTitle').textContent=(sessionId?'Edit ':'New ')+tabLabel()+' session';
  document.getElementById('deleteSessionBtn').style.display=sessionId?'':'none';
  document.getElementById('fTrapField').style.display=(currentTab==='bt')?'block':'none';
  document.getElementById('fLegionField').style.display=(currentTab==='foundry')?'block':'none';
  document.getElementById('fLabelField').style.display=(currentTab==='foundry')?'none':'block';
  document.getElementById('addPlayerRow').style.display=(currentTab==='bt')?'flex':'none';
  currentEntries={};

  if(sessionId){
    var sRow, eRows;
    if(currentTab==='bt'){
      sRow=(await sb.from('bt_sessions').select('*').eq('id',sessionId).maybeSingle()).data;
      eRows=(await sb.from('bt_entries').select('*').eq('session_id',sessionId)).data||[];
    }else{
      sRow=(await sb.from('event_sessions').select('*').eq('id',sessionId).maybeSingle()).data;
      eRows=(await sb.from('event_entries').select('*').eq('session_id',sessionId)).data||[];
    }
    document.getElementById('fDate').value=sRow?sRow.session_date:'';
    document.getElementById('fLabel').value=sRow?(sRow.label||''):'';
    entryTrap=(sRow&&sRow.trap)||'T1';
    entryLegion=(sRow&&sRow.label==='Legión 2')?'L2':'L1';
    eRows.forEach(function(e){
      var key=(currentTab==='bt')?(e.player_name||'').toLowerCase():(e.player_id||('name:'+e.player_name));
      currentEntries[key]={attended:!!e.attended,requested:!!e.requested,damage:e.damage||0,name:e.player_name};
    });
  }else{
    document.getElementById('fDate').value=new Date().toISOString().slice(0,10);
    document.getElementById('fLabel').value='';
    entryTrap='T1';
    entryLegion='L1';
  }
  document.querySelectorAll('#entryTrapTabs .trapTab').forEach(function(t){
    t.classList.toggle('on', t.dataset.trap===entryTrap);
  });
  document.querySelectorAll('#entryLegionTabs .legionTab').forEach(function(t){
    t.classList.toggle('on', t.dataset.legion===entryLegion);
  });
  document.getElementById('rosterSearch').value='';
  renderRoster('');
}

function renderRoster(filter){
  var box=document.getElementById('rosterList');
  box.innerHTML='';
  var f=(filter||'').toLowerCase();
  roster.filter(function(p){return !f||p.name.toLowerCase().indexOf(f)>=0;}).forEach(function(p){
    var e=currentEntries[(currentTab==='bt')?p.name.toLowerCase():p.id]||{attended:false,requested:false,damage:0};
    var row=document.createElement('div');
    row.className='rosterRow';
    if(currentTab==='bt'){
      row.innerHTML=
        '<div class="rosterName">'+escapeHtml(p.name)+'</div>'+
        '<label class="rosterChk" style="font-size:.8rem;"><input type="checkbox" class="rAttended" '+(e.attended?'checked':'')+'> Attended</label>';
    }else{
      row.innerHTML=
        '<div class="rosterName">'+escapeHtml(p.name)+'</div>'+
        '<label class="rosterChk"><input type="checkbox" class="rRequested" '+(e.requested?'checked':'')+'> Requested</label>'+
        '<label class="rosterChk"><input type="checkbox" class="rAttended" '+(e.attended?'checked':'')+'> Attended</label>';
    }
    row.dataset.pid=p.id; row.dataset.pname=p.name;
    box.appendChild(row);
  });
}

async function saveSession(){
  var date=document.getElementById('fDate').value;
  if(!date){toast('Pick a date');return;}
  var label=(currentTab==='foundry')?(entryLegion==='L2'?'Legión 2':'Legión 1'):(document.getElementById('fLabel').value.trim()||null);
  var btn=document.getElementById('saveSessionBtn'); btn.textContent='Saving…'; btn.disabled=true;

  try{
    var sessionId=editingSessionId;
    if(currentTab==='bt'){
      if(sessionId){
        await sb.from('bt_sessions').update({session_date:date,label:label,trap:entryTrap}).eq('id',sessionId);
        await sb.from('bt_entries').delete().eq('session_id',sessionId);
      }else{
        var ins=await sb.from('bt_sessions').insert({alliance_id:ACTIVE_ALLIANCE_ID,session_date:date,label:label,trap:entryTrap}).select('id').single();
        sessionId=ins.data.id;
      }
      var rows=[];
      document.querySelectorAll('#rosterList .rosterRow').forEach(function(row){
        var attended=row.querySelector('.rAttended').checked;
        if(attended){
          rows.push({session_id:sessionId,player_name:row.dataset.pname,attended:true});
        }
      });
      if(rows.length) await sb.from('bt_entries').insert(rows);
    }else{
      if(sessionId){
        await sb.from('event_sessions').update({session_date:date,label:label}).eq('id',sessionId);
        await sb.from('event_entries').delete().eq('session_id',sessionId);
      }else{
        var ins=await sb.from('event_sessions').insert({alliance_id:ACTIVE_ALLIANCE_ID,event_type:currentTab,session_date:date,label:label}).select('id').single();
        sessionId=ins.data.id;
      }
      var rows=[];
      document.querySelectorAll('#rosterList .rosterRow').forEach(function(row){
        var requested=row.querySelector('.rRequested').checked;
        var attended=row.querySelector('.rAttended').checked;
        if(requested||attended){
          rows.push({session_id:sessionId,player_id:row.dataset.pid,player_name:row.dataset.pname,requested:requested,attended:attended});
        }
      });
      if(rows.length) await sb.from('event_entries').insert(rows);
    }
    toast('Session saved ✓');
    showSummaryScreen();
  }catch(e){ console.error(e); toast('Save failed: '+e.message); }
  btn.textContent='💾 Save session'; btn.disabled=false;
}

async function deleteSession(){
  if(!editingSessionId) return;
  if(!confirm('Delete this session and all its entries?')) return;
  try{
    if(currentTab==='bt') await sb.from('bt_sessions').delete().eq('id',editingSessionId);
    else await sb.from('event_sessions').delete().eq('id',editingSessionId);
    toast('Deleted');
    showSummaryScreen();
  }catch(e){ toast('Delete failed: '+e.message); }
}
